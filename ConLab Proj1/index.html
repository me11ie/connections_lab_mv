<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask a Dataset</title>
    <link href="https://fonts.googleapis.com/css2?family=Purple+Purse&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Engagement&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    </link>
</head>


<body>

<section class="rpicker">
    <h1 class="rpicker__title">Emotion Picker</h1>
    <h2> Select your current emotion to find a fairy tale excerpt matching how you feel</h2>

    <div class="rpicker__dropdowns">
        <div class="rpicker__field">
            <label for="feelings">How are you feeling?</label>
            <select name="feelings" id="feelings">
                <option value="" disabled selected>Choose a feeling</option>
                <option value="angry_disgusted">angry-disgusted</option>
                <option value="fearful">fearful</option>
                <option value="happy">happy</option>
                <option value="sad">sad</option>
                <option value="surprised">surprised</option>
            </select>
        </div>

        <div class="rpicker__field">
            <label for="dropdown-2">Intensity?</label>
            <select name="dropdown-2" id="dropdown-2">
                <option value="" disabled selected>Choose an option</option>
                <option value="mild">Mild</option>
                <option value="medium">Medium</option>
                <option value="hot">Hot</option>
            </select>
        </div>

        <div class="rpicker__field">
            <label for="dropdown-3">Mode of Expression?</label>
            <select name="dropdown-3" id="dropdown-3">
                <option value="" disabled selected>Choose an option</option>
                <option value="hca">Classic</option>
                <option value="beatrix">Wholesome</option>
                <option value="grimm">Morbid</option>
            </select>
        </div>
    </div>

    <p id="picked-name"> Your fairy tale match says:</p>
    <p> <span id = 'emotions_desc'></span></p>
</section>
