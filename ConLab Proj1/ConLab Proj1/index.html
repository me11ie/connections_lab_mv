<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fairy Tale Feelings Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Engagement&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Explora&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    </link>
</head>


<body>
<!-- title waved text -->
<svg class="title-svg" viewBox="0 -40 1000 200" xmlns="http://www.w3.org/2000/svg">
    <path id="curve" d="M10,80 Q132,180 255,80 T500,80 T745,80 T990,80" />
    <text>
        <textPath href="#curve" startOffset="50%" text-anchor="middle" textLength="960" lengthAdjust="spacing">
            Your Feelings: A Fairy Tale
        </textPath>
    </text>
</svg>

<!-- feelings input & description section -->
<section>
    <div class="feelings_title">
        <p>Make a feelings journal with fairy tale excerpts</p>
        </div>


    <div class = "feelings_display">
<!-- 
        lefthand feelings control -->
        <div class = "feelings_contain">

            <div class="feelings_iput">
            <div class="feelings_input_dropdown">
                <div class="feelings_input_field">
                    <label for="feelings">How are you feeling?</label>
                    <select name="feelings" id="feelings">
                        <option value="" disabled selected>Choose a feeling</option>
                        <option value="angry_disgusted">angry-disgusted</option>
                        <option value="fearful">fearful</option>
                        <option value="happy">happy</option>
                        <option value="sad">sad</option>
                        <option value="surprised">surprised</option>
                    </select>
                </div>
                </div>
            </div>

            <div class="feelings_iput">
                <div class="feelings_input_field">
                    <label for="dropdown-2">Intensity?</label>
                    <select name="dropdown-2" id="dropdown-2">
                        <option value="" disabled selected>Choose an option</option>
                        <option value="mild">Mild</option>
                        <option value="medium">Medium</option>
                        <option value="hot">Hot</option>
                    </select>
                </div>
        </div>

    <div class="feelings_iput">
        <div class="feelings_input_field">
            <label for="dropdown-3">Mode of Expression?</label>
            <select name="dropdown-3" id="dropdown-3">
                <option value="" disabled selected>Choose an option</option>
                <option value="hca">Classic</option>
                <option value="beatrix">Wholesome</option>
                <option value="grimm">Morbid</option>
            </select>
        </div>
    </div>
    </div>

<!-- center image appear -->
 <div class = "feelings_contain">
        <div class = "feelings_entry">
            <div class = "feelings_entry_child"> feeling 1</div>
            <div class="feelings_entry_child"> feeling 2</div>
            <div class="feelings_entry_child"> feeling 3 </div>
        </div>
</div>


<!-- righthand animate control -->
<div class="feelings_contain">
    <div class="feelings_iput">Change your vibe</div>
    <div class="feelings_input">
        More vibe options
    </div>
</div>


</section>



        <!-- link javascript -->
        <script src="script.js"></script>

</body>

</html>
